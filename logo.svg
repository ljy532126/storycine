<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C96A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Film strip top -->
  <rect x="100" y="40" width="312" height="24" rx="4" fill="url(#gold)" opacity="0.3"/>
  <rect x="100" y="40" width="312" height="6" rx="3" fill="url(#gold)"/>

  <!-- Center icon: SC monogram -->
  <text x="256" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="160" font-weight="900" fill="url(#gold)" font-style="italic">SC</text>

  <!-- Film strip bottom -->
  <rect x="100" y="448" width="312" height="24" rx="4" fill="url(#gold)" opacity="0.3"/>
  <rect x="100" y="448" width="312" height="6" rx="3" fill="url(#gold)"/>

  <!-- Subtitle -->
  <text x="256" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#C9A84C" letter-spacing="12" opacity="0.8">CINE</text>

  <!-- Decorative dots (film perforations) -->
  <circle cx="128" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="168" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="208" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="248" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="288" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="328" cy="52" r="5" fill="#1a1a2e"/>
  <circle cx="368" cy="52" r="5" fill="#1a1a2e"/>

  <circle cx="128" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="168" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="208" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="248" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="288" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="328" cy="460" r="5" fill="#1a1a2e"/>
  <circle cx="368" cy="460" r="5" fill="#1a1a2e"/>

  <!-- Bottom line -->
  <line x1="180" y1="390" x2="332" y2="390" stroke="#C9A84C" stroke-width="1.5" opacity="0.25"/>
</svg>
